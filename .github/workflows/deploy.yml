name: Deploy to GitHub Pages

# MANUAL por ahora: no se publica en ningún push. Para publicar, lanzar el
# workflow a mano (pestaña Actions → "Deploy to GitHub Pages" → Run workflow),
# o cambiar el trigger a `push: { branches: [main] }` cuando se quiera CD.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Astro
        uses: withastro/action@v3
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://escaliburcalibur.github.io' }}
          SITE_BASE: ${{ vars.SITE_BASE || '/portfolio' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
