name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run check

      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://escaliburcalibur.github.io' }}
          SITE_BASE: ${{ vars.SITE_BASE || '/portfolio' }}
